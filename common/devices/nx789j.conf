# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="Red Magic 10 Pro (NX789J)"
KIND=phone                      # phone | qemu
SOC="Qualcomm SM8750 (Snapdragon 8 Elite)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The same SoC as the REDMI K90 (annibale.conf): a Mu-Silicium UEFI started with `fastboot boot`, which
# starts our loader; the device tree is the phone's own (adb: su -c cat /sys/firmware/fdt).
UEFI_TARGET=nx789j
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/...
DTB=empty.dtb                   # only the boot image's dtb slot (LK caps fastboot boot at ~2 MB); the UEFI
                                # carries the phone's own (nx789jPkg/FdtBlob, from adb: /sys/firmware/fdt)
FD_BASE=0xA7100000              # SM8750 UEFI load region (System RAM a2880000-b7ffffff here too)
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # where the kernel + images container goes (free RAM in the memory map)

# --- kernel and loader -----------------------------------------------------------------------------
# The K90's loader platform (platform_annibale) fits as it is: GIC 0x16000000/0x16080000 with the
# 0x40000 redistributor stride, MPIDRs 0..0x500 and 0x10000/0x10100, small cores 0x3f, and LK's
# splash region at 0xfc800000 (0x2b00000), all the same in this phone's device tree. Only the
# panel differs: RM692H5 (bf237), 1216x2688, command mode with DSC.
FB_BASE=0xFC800000
LOADER_CFLAGS="-DDIRECT_PHONE_PLAT -DPHONE_FB_WIDTH=1216 -DPHONE_FB_HEIGHT=2688"
WIFI_ATH11K=0                   # no driver for its radio yet

# --- what the run needs ----------------------------------------------------------------------------
# No touchscreen=: its Goodix 9916 runs THP firmware (design/nx789j); the K90's touchscreen=2 is
# that phone's wiring.
BOOTARGS="cpus=1"
DEFAULT_SECS=900
USERLAND_VARS="GL=1"
FIRMWARE=""
