# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="Red Magic 10 Pro (NX789J)"
KIND=phone                      # phone | qemu
SOC="Qualcomm SM8750 (Snapdragon 8 Elite)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The same SoC as the REDMI K90 (annibale.conf): a Mu-Silicium UEFI (Platforms/ZTE/nx789jPkg, kept in
# uefi/nx789j/) that starts our loader. This phone's stock ABL refuses `fastboot boot` (and flash/erase
# in its own fastboot), and fastbootd lives in the recovery image, so recovery is left alone: the image
# goes to boot_a (slot a is the spare, old firmware, marked unbootable) from rooted Android, and slot a
# gets one attempt (ENTER=slot-a, see ./xl and design/nx789j/oneshot-slot-a.py); the next reboot falls
# back to b by itself. Header v4 as Mu-Silicium builds for nx789j: the 24 Oct v1 image with an empty
# DTB dropped the ABL to fastboot (no appended DTB found); `fastboot continue` gets out of that.
UEFI_TARGET=nx789j
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/...
DTB=design/nx789j/nx789j-live.dtb   # appended to the kernel (no ~2 MB fastboot-boot cap on a partition)
BOOT_HEADER=4
ENTER=slot-a                    # boot_a written over adb (root), one attempt on slot a, adb reboot
FD_BASE=0xA7100000              # SM8750 UEFI load region (System RAM a2880000-b7ffffff here too)
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # XNU_Payload in nx789jPkg's memory map: plain RAM up to trust_ui_vm
PAYLOAD_CAP=0x03700000          # (0xF3800000), as on the K90; the same strict container contract

# --- kernel and loader -----------------------------------------------------------------------------
# The K90's loader platform (platform_annibale) fits as it is: GIC 0x16000000/0x16080000 with the
# 0x40000 redistributor stride, MPIDRs 0..0x500 and 0x10000/0x10100, small cores 0x3f, and LK's
# splash region at 0xfc800000 (0x2b00000), all the same in this phone's device tree. Only the
# panel differs: RM692H5 (bf237), 1216x2688, command mode with DSC.
FB_BASE=0xFC800000
LOADER_CFLAGS="-DDIRECT_PHONE_PLAT -DPHONE_FB_WIDTH=1216 -DPHONE_FB_HEIGHT=2688"
WIFI_ATH11K=0                   # no driver for its radio yet

# --- what the run needs ----------------------------------------------------------------------------
# No touchscreen=: its Goodix 9916 runs THP firmware (design/nx789j); the K90's touchscreen=2 is
# that phone's wiring.
BOOTARGS=""                     # every core the firmware says is free (the loader lists them); cpus=N narrows
DEFAULT_SECS=900
USERLAND_VARS=""              # software CoreAnimation first; GL=1 needs Mesa (tools/mk-mesa.sh)
                                # and the Adreno firmware from the phone
FIRMWARE=""
