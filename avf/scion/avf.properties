# iOS 16.5 (AVF): HackiOS's XNU under crosvm. avfboot (Image) loads the payload: the kernel and
# root.apfs (the small image, /dev/md1). system.apfs (iOS 16.5, 2.5 GB) is a read-only virtio
# disk that the kernel names md0 (md0=rvblk0), the root, as on HackiOS's QEMU and phone setups.
# Add -v to params for the verbose console (launchd then logs every notice to it, which costs
# CPU: SpringBoard's failed lookups alone are hundreds of lines a minute).
# One vCPU for now: with 8 host-matched vCPUs the kernel panicked on a ticket spinlock timeout
# under pKVM (avfboot sets no machine-timeouts scale yet).
kernel=Image
initrd=payload.bin
disk.0=system.apfs
# virtio_net_wifi=1: with Scion's "Network" setting on, AVF adds a virtio-net card (Android's VM
# tethering behind it) and iOS sees it as Wi-Fi, joined to the open network "Scion"
# (bsd/dev/redwood_virtio_net.c). Without the setting there is no card and it does nothing.
params=md0=rvblk0 virtio_net_wifi=1
memory_mib=4096
cpus=1
